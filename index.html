<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projeto</title>
    <link rel="stylesheet" href="index.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    
</head>
<body>
    <header>
        <input type="text" id="busca" placeholder="pesquisar por título">
    </header>
    <main>
        <section id="tarefas">
            <h2>Tarefas <button onclick="novaTarefa()">nova tarefa</button></h2>
            <h6>Nenhuma tarefa localizada</h6>
        </section>
        <section id="overlay"></section>
        <div id="criarTarefa" class="modal">
            <form action="">
                <h3>Criar tarefa <i class='bx bx-x'></i></h3>
            <!-- <h3>Criar tarefa2 <box-icon name="x"></box-icon></h3>-->
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao"></textarea>
                <button>Criar</button>
            </form>
        </div>
    </main>
    
   <script src="https://unpkg.com/@boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="index.js"></script>
</body>
</html>
